function go(p){page=p;$('#side').classList.remove('open');render();window.scrollTo(0,0)}
function showToast(t){const x=$('#toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),2200)}
function modalForm(title,fields,submit){$('#modalTitle').textContent=title;$('#modalFields').innerHTML=fields.map(f=>`<div class="form-field ${f.full?'full':''}"><label>${esc(f.label)}</label>${f.options?`<select class="field wide" name="${f.key}" ${f.required?'required':''}>${f.options.map(o=>`<option ${o===f.value?'selected':''}>${esc(o)}</option>`).join('')}</select>`:f.type==='textarea'?`<textarea class="field wide" name="${f.key}" placeholder="${esc(f.placeholder||'')}" ${f.required?'required':''}>${esc(f.value||'')}</textarea>`:`<input class="field wide" name="${f.key}" type="${f.type||'text'}" value="${esc(f.value||'')}" placeholder="${esc(f.placeholder||'')}" ${f.required?'required':''} ${f.min!==undefined?`min="${f.min}"`:''}>`}</div>`).join('');$('#modal').classList.add('open');$('#modalForm').onsubmit=e=>{e.preventDefault();submit(Object.fromEntries(new FormData(e.currentTarget)));$('#modal').classList.remove('open');render()}}
function editEvent(){modalForm('Edit event details',[{key:'title',label:'Event title',value:state.event.title,required:true},{key:'date',label:'Event date',value:state.event.date,type:'date'},{key:'venue',label:'Venue / location',value:state.event.venue},{key:'prep',label:'Preparation starts',value:scheduleFacts().prep},{key:'doors',label:'Doors open',value:state.event.doors}],v=>{state.event={...state.event,...v};let first=state.schedule.slice().sort((a,b)=>toMin(a.start)-toMin(b.start)).find(x=>x.phase==='Preparation');if(first)first.start=v.prep;document.querySelector('.side-bottom').innerHTML=`<b>Event day</b><br>${esc(dateLabel())}<br><span style="display:block;margin-top:7px">Preparation ${esc(scheduleFacts().prep)} · Worship ${esc(scheduleFacts().mainStart)}–${esc(scheduleFacts().mainEnd)}</span>`;save()})}
function editSchedule(id){let x=state.schedule.find(s=>s.id===id),data=x||{start:'',end:'',title:'',responsible:'',phase:'Worship programme'};modalForm(x?'Edit programme item':'Add programme item',[{key:'start',label:'Start time',value:data.start,placeholder:'4:45 PM',required:true},{key:'end',label:'End time',value:data.end,placeholder:'5:00 PM',required:true},{key:'title',label:'Programme item',value:data.title,required:true},{key:'responsible',label:'Responsible person / team',value:data.responsible},{key:'phase',label:'Phase',value:data.phase,options:['Preparation','Worship programme','Closeout']}],v=>{if(x)Object.assign(x,v);else state.schedule.push({id:makeId(),...v});save()})}
function editTask(id,dept){let x=state.tasks.find(t=>t.id===id),d=dept||x?.department||departments[0],data=x||{title:'',department:d,responsibility:d,status:'Not started',due:'',notes:'',signoff:''};modalForm(x?'Edit task':'Add task',[{key:'title',label:'Task',value:data.title,required:true,full:true},{key:'department',label:'Department',value:data.department,options:departments},{key:'responsibility',label:'Responsible person / role',value:data.responsibility},{key:'status',label:'Status',value:data.status,options:['Not started','In progress','Blocked','Complete']},{key:'due',label:'Due time',value:data.due,placeholder:'e.g. 2:45 PM'},{key:'notes',label:'Notes',value:data.notes,type:'textarea',full:true},{key:'signoff',label:'Sign-off name / initials',value:data.signoff}],v=>{if(x)Object.assign(x,v);else state.tasks.push({id:makeId(),...v});save()})}
function editGuest(id){let x=state.guests.find(g=>g.id===id),d=x||{name:'',role:'Guest artist',confirmation:'Pending',arrival:'',transport:'',reception:'',seat:'Reserved — confirm',hospitality:'',gift:'Planned',notes:''};modalForm(x?'Edit guest details':'Add guest',[{key:'name',label:'Guest name',value:d.name,required:true},{key:'role',label:'Role',value:d.role,options:['Guest artist','Guest minister','Guest ministry','Host','Other']},{key:'confirmation',label:'Confirmation',value:d.confirmation,options:['Pending','Confirmed','Declined']},{key:'arrival',label:'Arrival time',value:d.arrival,placeholder:'Time / date'},{key:'transport',label:'Transport details',value:d.transport},{key:'reception',label:'Reception / pickup notes',value:d.reception},{key:'seat',label:'Reserved seating',value:d.seat},{key:'hospitality',label:'Hospitality needs',value:d.hospitality},{key:'gift',label:'Gift status',value:d.gift,options:['Not planned','Planned','Purchased','Presented']},{key:'giftItem',label:'Gift item / presentation details',value:d.giftItem},{key:'notes',label:'Protocol notes',value:d.notes,type:'textarea',full:true}],v=>{if(x)Object.assign(x,v);else state.guests.push({id:makeId(),...v});save()})}
function editBudget(id){let x=state.budget.find(b=>b.id===id),d=x||{item:'',department:'Finance',budget:0,actual:0,paid:0,payee:'',notes:'',status:'Planned'};modalForm(x?'Edit budget line':'Add budget line',[{key:'item',label:'Item / purpose',value:d.item,required:true},{key:'department',label:'Department',value:d.department,options:departments},{key:'budget',label:'Approved budget (NT$)',type:'number',min:0,value:d.budget},{key:'actual',label:'Actual expense (NT$)',type:'number',min:0,value:d.actual},{key:'paid',label:'Amount paid (NT$)',type:'number',min:0,value:d.paid},{key:'payee',label:'Payee / payment reference',value:d.payee},{key:'status',label:'Payment status',value:d.status,options:['Planned','Pending approval','Approved','Paid']},{key:'notes',label:'Receipt / notes',value:d.notes,type:'textarea',full:true}],v=>{if(x)Object.assign(x,v);else state.budget.push({id:makeId(),...v});save()})}
function editTicket(id){let x=state.tickets.find(t=>t.id===id),d=x||{name:'',email:'',phone:'',type:'General admission',status:'Issued',code:'RR-'+makeId(),checked:false,checkinAt:''};modalForm(x?'Edit attendee':'Add attendee',[{key:'name',label:'Attendee full name',value:d.name,required:true},{key:'email',label:'Email',value:d.email},{key:'phone',label:'Phone',value:d.phone},{key:'type',label:'Ticket type',value:d.type,options:['General admission','VIP','Guest / artist','Volunteer','Other']},{key:'code',label:'Ticket ID / QR value',value:d.code||'RR-'+makeId(),required:true},{key:'status',label:'Ticket status',value:d.status||'Issued',options:['Issued','Comp','Cancelled','Waitlist']}],v=>{if(x)Object.assign(x,v);else state.tickets.push({id:makeId(),...v,checked:false,checkinAt:''});save()})}
function del(list,id,label){if(confirm(`Remove this ${label}?`)){state[list]=state[list].filter(x=>x.id!==id);save();render()}}
function exportData(){let b=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='rivers-of-revival-event-backup.json';a.click();URL.revokeObjectURL(a.href);showToast('Event backup downloaded')}
function importBackup(file){let r=new FileReader();r.onload=()=>{try{let next=JSON.parse(r.result);if(!next.event||!Array.isArray(next.tasks)||!Array.isArray(next.schedule)||!Array.isArray(next.guests)||!Array.isArray(next.tickets)||!Array.isArray(next.budget)||!Array.isArray(next.closeout))throw Error('Invalid backup');if(!confirm('Replace the current event data on this device with this backup?'))return;state=next;save();render();showToast('Event backup restored')}catch{showToast('Could not read this event backup')}};r.readAsText(file)}
function checkIn(code){let raw=String(code||'').trim(),ticket=state.tickets.find(t=>t.code.toLowerCase()===raw.toLowerCase());if(!ticket){try{let o=JSON.parse(raw);ticket=state.tickets.find(t=>t.code===o.ticketId||t.id===o.attendeeId)}catch{}}if(!ticket){showToast('No attendee found for that ticket ID');return false}if(ticket.checked){showToast(`${ticket.name} is already checked in`);return false}ticket.checked=true;ticket.checkinAt=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});ticket.status='Checked in';save();showToast(`${ticket.name} checked in`);render();return true}
function showQR(id){let t=state.tickets.find(x=>x.id===id);if(!t)return;modalForm('Attendee ticket · '+t.code,[{key:'name',label:'Attendee',value:t.name},{key:'email',label:'Email',value:t.email},{key:'phone',label:'Phone',value:t.phone},{key:'type',label:'Ticket type',value:t.type,options:['General admission','VIP','Guest / artist','Volunteer','Other']},{key:'code',label:'Ticket ID (QR value)',value:t.code,required:true},{key:'status',label:'Ticket status',value:t.status==='Checked in'?'Checked in':t.status,options:['Issued','Comp','Cancelled','Waitlist','Checked in']}],v=>{Object.assign(t,v);save()});let f=document.createElement('div');f.className='form-field full';f.innerHTML=`<label>QR pass · scan this code or enter the ticket ID at check-in</label><div class="qr-card"><div class="qr-box" id="qrCanvas"><span class="qr-fallback">${esc(t.code)}</span></div><div><b>${esc(t.name)}</b><div class="small-note">${esc(t.type)} · ${esc(t.code)}</div><div class="row-actions" style="margin-top:8px"><button class="btn small" type="button" id="printTicket">Print pass</button></div></div></div>`;$('#modalFields').appendChild(f);setTimeout(()=>{if(window.QRCode)QRCode.toCanvas(document.createElement('canvas'),JSON.stringify({ticketId:t.code,attendeeId:t.id}),{width:92,margin:1},(err,canvas)=>{if(!err){$('#qrCanvas').innerHTML='';$('#qrCanvas').appendChild(canvas)}});$('#printTicket')?.addEventListener('click',()=>{const w=window.open('','_blank');if(!w)return;w.document.write(`<main style="font:16px system-ui;text-align:center;padding:35px"><h2>Rivers of Revival</h2><p>${esc(t.name)} · ${esc(t.type)}</p><h3>${esc(t.code)}</h3><div id="qr"></div><p>Saturday, 12 December 2026 · Taoyuan</p></main>`);w.document.close();setTimeout(()=>w.print(),600)})},0)}
function downloadCSV(){let rows=[['name','email','phone','ticket_type','ticket_id','status','checked_in_at'],...state.tickets.map(t=>[t.name,t.email,t.phone,t.type,t.code,t.status,t.checkinAt])],txt=rows.map(r=>r.map(c=>'"'+String(c||'').replaceAll('"','""')+'"').join(',')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'text/csv'}));a.download='rivers-of-revival-attendees.csv';a.click();URL.revokeObjectURL(a.href)}
function parseCSV(s){let lines=s.trim().split(/\r?\n/),parse=line=>{let out=[],cur='',q=false;for(let i=0;i<line.length;i++){if(line[i]==='"'&&line[i+1]==='"'&&q){cur+='"';i++}else if(line[i]==='"')q=!q;else if(line[i]===','&&!q){out.push(cur);cur=''}else cur+=line[i]}out.push(cur);return out};let hs=parse(lines.shift()).map(x=>x.toLowerCase().replace(/[ _-]/g,''));for(let line of lines){let r=parse(line),g=k=>r[hs.indexOf(k)]||'',name=g('name');if(name)state.tickets.push({id:makeId(),name,email:g('email'),phone:g('phone'),type:g('tickettype')||g('type')||'General admission',code:g('ticketid')||g('code')||'RR-'+makeId(),status:'Issued',checked:false,checkinAt:''})}save();render();showToast('Attendees imported')}
function wireInputs(){document.querySelectorAll('[data-page]').forEach(x=>x.onclick=()=>go(x.dataset.page));document.querySelectorAll('[data-dept]').forEach(x=>x.onclick=()=>{filterDept=x.dataset.dept;go('departments')});document.querySelectorAll('[data-task]').forEach(x=>x.onchange=()=>{let t=state.tasks.find(v=>v.id===x.dataset.task);if(t){t[x.dataset.key]=x.value;save();if(x.dataset.key==='status')render()}});document.querySelectorAll('[data-budget]').forEach(x=>x.onchange=()=>{let t=state.budget.find(v=>v.id===x.dataset.budget);if(t){t[x.dataset.key]=x.value;save();render()}});document.querySelectorAll('[data-close]').forEach(x=>x.onchange=()=>{let t=state.closeout.find(v=>v.id===x.dataset.close);if(t){if(x.dataset.key==='complete')t.status=x.checked?'Complete':'Not started';else t[x.dataset.key]=x.value;save();render()}});$('#deptFilter')?.addEventListener('change',e=>{filterDept=e.target.value;render()});$('#guestSearch')?.addEventListener('input',e=>{guestSearch=e.target.value;let at=e.target.selectionStart;render();$('#guestSearch').focus();$('#guestSearch').setSelectionRange(at,at)});$('#ticketSearch')?.addEventListener('input',e=>{ticketSearch=e.target.value;let at=e.target.selectionStart;render();$('#ticketSearch').focus();$('#ticketSearch').setSelectionRange(at,at)});document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{let a=b.dataset.action,id=b.dataset.id;if(a==='edit-event')editEvent();if(a==='add-schedule')editSchedule();if(a==='edit-schedule')editSchedule(id);if(a==='delete-schedule')del('schedule',id,'programme item');if(a==='add-task')editTask(null,b.dataset.dept);if(a==='delete-task')del('tasks',id,'task');if(a==='add-guest')editGuest();if(a==='edit-guest')editGuest(id);if(a==='delete-guest')del('guests',id,'guest');if(a==='add-ticket')editTicket();if(a==='show-qr')showQR(id);if(a==='add-budget')editBudget();if(a==='delete-budget')del('budget',id,'budget line');if(a==='checkin'){checkIn($('#scanCode').value);$('#scanCode').value=''}if(a==='download-attendees')downloadCSV();if(a==='import-attendees')$('#csvFile').click();if(a==='add-closeout'){modalForm('Add closeout action',[{key:'title',label:'Action',value:'',required:true},{key:'owner',label:'Owner',value:'Event Coordinator'},{key:'notes',label:'Notes',value:'',type:'textarea',full:true}],v=>{state.closeout.push({id:makeId(),...v,status:'Not started',signed:''});save()})}if(a==='delete-closeout')del('closeout',id,'closeout action');if(a==='export')exportData();if(a==='programme-print')window.print();if(a==='camera-scan')startCamera();});$('#csvFile')?.addEventListener('change',async e=>{let f=e.target.files[0];if(f)parseCSV(await f.text());e.target.value=''});$('#scanCode')?.addEventListener('keydown',e=>{if(e.key==='Enter'){checkIn(e.target.value);e.target.value=''}})}
async function startCamera(){const video=$('#camera'),hint=$('#cameraHint');if(!('BarcodeDetector'in window)){hint.textContent='Camera QR scan is unavailable here. Enter ticket ID manually.';return}try{let stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});video.srcObject=stream;video.classList.remove('hide');await video.play();let detector=new BarcodeDetector({formats:['qr_code']});hint.textContent='Point camera at a ticket QR.';const scan=async()=>{if(video.classList.contains('hide'))return;try{let codes=await detector.detect(video);if(codes.length){checkIn(codes[0].rawValue);stream.getTracks().forEach(t=>t.stop());video.classList.add('hide');return}}catch{}requestAnimationFrame(scan)};scan()}catch{hint.textContent='Camera permission is needed. You can enter the ticket ID manually.'}}
$('#exportBtn').onclick=exportData;$('#importBackupBtn').onclick=()=>$('#backupFile').click();$('#backupFile').onchange=e=>{if(e.target.files[0])importBackup(e.target.files[0]);e.target.value=''};$('#menuBtn').onclick=()=>$('#side').classList.toggle('open');$('#closeModal').onclick=$('#cancelModal').onclick=()=>$('#modal').classList.remove('open');$('#modal').onclick=e=>{if(e.target.id==='modal')$('#modal').classList.remove('open')};document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#modal').classList.remove('open')});
render();
})();
</script>
</body>
